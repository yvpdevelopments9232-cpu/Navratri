name: Build iOS IPA & macOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-macos:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r Navratri_Utsav_macOS.zip Navratri.app
          cd ../../../../../

      - name: Build iOS Application (IPA)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Navratri_Utsav_iOS.ipa Payload
          cd ../../../

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Navratri_Utsav_iOS_IPA
          path: build/ios/iphoneos/Navratri_Utsav_iOS.ipa
          if-no-files-found: error

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Navratri_Utsav_macOS_Bundle
          path: build/macos/Build/Products/Release/Navratri_Utsav_macOS.zip
          if-no-files-found: error
